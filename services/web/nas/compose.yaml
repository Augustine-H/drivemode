services:
  config-init:
    image: node:24-bookworm-slim
    user: "0:0"
    command: ["sh", "-c", "cp /input/runtime.json /config/runtime.json && chown 1000:1000 /config /config/runtime.json /google && chmod 700 /config /google && chmod 600 /config/runtime.json && chown 0:0 /input /input/runtime.json /input/google-oauth.env && chmod 700 /input && chmod 600 /input/runtime.json /input/google-oauth.env"]
    network_mode: none
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./private:/input
      - web-config:/config
      - google-data:/google
  web:
    image: voice-grok-web:1.33.0-https1
    build: .
    depends_on:
      config-init:
        condition: service_completed_successfully
    network_mode: host
    env_file:
      - ./private/google-oauth.env
    environment:
      VOICE_GROK_WEB_PORT: "8097"
      GOOGLE_REDIRECT_URI: "https://ds218-hmh.tail15dbbb.ts.net:8445/api/google-workspace/callback"
    # Resolve tailnet names through MagicDNS even after a NAS reboot.
    dns:
      - 100.100.100.100
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - web-config:/run/config:ro
      - google-data:/run/google
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
volumes:
  web-config:
  google-data:
